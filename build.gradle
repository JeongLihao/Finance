plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
def configurePhase6Userdev = { cfg, String launchTarget, boolean clientRun ->
    cfg.main 'cpw.mods.bootstraplauncher.BootstrapLauncher'
    cfg.args '--launchTarget', launchTarget
    if (clientRun) cfg.args '--version', 'MOD_DEV', '--assetIndex', '{asset_index}', '--assetsDir', '{assets_root}'
    cfg.args '--gameDir', '.', '--fml.forgeVersion', forge_version, '--fml.mcVersion', minecraft_version,
            '--fml.forgeGroup', 'net.minecraftforge', '--fml.mcpVersion', '20230612.114412'
    cfg.jvmArgs '-Djava.net.preferIPv6Addresses=system', '-p', '{modules}', '--add-modules', 'ALL-MODULE-PATH',
            '--add-opens', 'java.base/java.util.jar=cpw.mods.securejarhandler',
            '--add-opens', 'java.base/java.lang.invoke=cpw.mods.securejarhandler',
            '--add-exports', 'java.base/sun.security.util=cpw.mods.securejarhandler',
            '--add-exports', 'jdk.naming.dns/com.sun.jndi.dns=java.naming'
    cfg.environment 'MOD_CLASSES', '{source_roots}'
    cfg.environment 'MCP_MAPPINGS', '{mcp_mappings}'
    cfg.property 'legacyClassPath.file', '{minecraft_classpath_file}'
    cfg.property 'ignoreList', 'bootstraplauncher,securejarhandler,asm-commons,asm-util,asm-analysis,asm-tree,asm,JarJarFileSystems,client-extra,fmlcore,javafmllanguage,lowcodelanguage,mclanguage,forge-'
    cfg.property 'mergeModules', 'jna-5.10.0.jar,jna-platform-5.10.0.jar'
    cfg.property 'forge.enableGameTest', 'true'
    cfg.client clientRun
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', ''

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Isolated Phase 6 multiplayer acceptance runs. Each client has its own
        // game directory and identity so two instances can be connected at once.
        phase6Server {
            configurePhase6Userdev(delegate, 'forgeserveruserdev', false)
            workingDirectory project.file('build/phase6/server')
            jvmArgs '-Dterminal.jline=false', '-Dterminal.ansi=false'
            args '--nogui'
        }

        phase6ClientA {
            configurePhase6Userdev(delegate, 'forgeclientuserdev', true)
            singleInstance false
            workingDirectory project.file('build/phase6/client-a')
            args '--username', 'Phase6PlayerA', '--quickPlayMultiplayer', '127.0.0.1:25566',
                '--width', '960', '--height', '540'
        }

        phase6ClientB {
            configurePhase6Userdev(delegate, 'forgeclientuserdev', true)
            singleInstance false
            workingDirectory project.file('build/phase6/client-b')
            args '--username', 'Phase6PlayerB', '--quickPlayMultiplayer', '127.0.0.1:25566',
                '--width', '1280', '--height', '720'
        }

        phase6ClientAdmin {
            configurePhase6Userdev(delegate, 'forgeclientuserdev', true)
            singleInstance false
            workingDirectory project.file('build/phase6/client-admin')
            args '--username', 'Phase6Admin', '--quickPlayMultiplayer', '127.0.0.1:25566',
                '--width', '1920', '--height', '1080'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

def phase6Root = layout.buildDirectory.dir('phase6')
tasks.register('preparePhase6Acceptance') {
    group = 'verification'
    description = 'Creates isolated server and client directories for Phase 6 multiplayer acceptance.'
    doNotTrackState('Phase 6 acceptance directories contain live Minecraft world and lock files.')
    doLast {
        def root = phase6Root.get().asFile
        def serverDir = new File(root, 'server')
        serverDir.mkdirs()
        new File(serverDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
        def adminName = 'Phase6Admin'
        def adminUuid = java.util.UUID.nameUUIDFromBytes(('OfflinePlayer:' + adminName).getBytes('UTF-8'))
        new File(serverDir, 'ops.json').setText("""[
  {"uuid":"${adminUuid}","name":"${adminName}","level":4,"bypassesPlayerLimit":true}
]\n""", 'UTF-8')
        def packDir = new File(serverDir, 'phase6-world/datapacks/phase6-acceptance')
        def loadTag = new File(packDir, 'data/minecraft/tags/functions/load.json')
        def tickTag = new File(packDir, 'data/minecraft/tags/functions/tick.json')
        def functionsDir = new File(packDir, 'data/phase6/functions')
        loadTag.parentFile.mkdirs()
        functionsDir.mkdirs()
        new File(packDir, 'pack.mcmeta').setText('{"pack":{"pack_format":15,"description":"Finance Phase 6 acceptance harness"}}\n', 'UTF-8')
        loadTag.setText('{"values":["phase6:setup"]}\n', 'UTF-8')
        tickTag.setText('{"values":["phase6:on_tick"]}\n', 'UTF-8')
        new File(functionsDir, 'setup.mcfunction').setText('''\
gamerule doDaylightCycle false
gamerule spawnRadius 0
time set day
''', 'UTF-8')
        def stagePositions = [
                market: -127.5D,
                warehouse: -125.5D,
                bank: -123.5D,
                company: -121.5D,
                factory: -119.5D,
                securities: -117.5D,
                central_bank: -115.5D,
                boardroom: -113.5D,
                settlement: -111.5D,
                exploration: -109.5D
        ]
        def requestedStage = (project.findProperty('phase6Stage') ?: 'market').toString().toLowerCase(Locale.ROOT)
        if (!stagePositions.containsKey(requestedStage)) {
            throw new GradleException("Unknown Phase 6 stage '${requestedStage}'. Expected one of ${stagePositions.keySet()}.")
        }
        def stageX = stagePositions[requestedStage]
        // Bump this tag when the acceptance-stage coordinates change so a
        // reused isolated world cannot leave testers at stale positions.
        def stageTag = "phase6_positioned_${requestedStage}_v3"
        new File(functionsDir, 'on_tick.mcfunction').setText("""\
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run forceload add -130 -35 -110 -15
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run fill -130 199 -35 -110 199 -15 minecraft:stone
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setworldspawn -120 200 -25
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -128 200 -33 finance:market_terminal
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -126 200 -33 finance:warehouse_controller
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -124 200 -33 finance:bank_counter
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -122 200 -33 finance:company_desk
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -120 200 -33 finance:company_factory_controller
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -118 200 -33 finance:securities_terminal
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -116 200 -33 finance:central_bank_console
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -114 200 -33 finance:boardroom_table
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -112 200 -33 finance:settlement_trade_station
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run setblock -110 200 -33 finance:survey_board
execute unless entity @e[type=minecraft:marker,tag=phase6_platform_v3] run summon minecraft:marker -120 198 -25 {Tags:["phase6_platform_v3"]}
give @a[tag=!phase6_ready,name=Phase6PlayerA] minecraft:iron_ingot 32
give @a[tag=!phase6_ready,name=Phase6PlayerB] minecraft:iron_ingot 32
gamemode survival @a[tag=!${stageTag}]
tp @a[tag=!${stageTag},name=Phase6PlayerA] ${stageX} 200 -28.5 180 20
tp @a[tag=!${stageTag},name=Phase6PlayerB] ${stageX} 200 -28.5 180 20
tp @a[tag=!${stageTag},name=Phase6Admin] ${stageX} 200 -28.5 180 20
tag @a[tag=!${stageTag}] add ${stageTag}
tag @a[tag=!phase6_ready] add phase6_ready
""", 'UTF-8')
        new File(serverDir, 'server.properties').setText('''\
online-mode=false
enforce-secure-profile=false
server-port=25566
level-name=phase6-world
difficulty=normal
gamemode=survival
spawn-protection=0
allow-flight=true
enable-command-block=false
max-players=8
view-distance=8
simulation-distance=6
motd=Finance Phase 6 Acceptance
''', 'UTF-8')
        [
                'client-a': 2,
                'client-b': 3,
                'client-admin': 4
        ].each { name, guiScale ->
            def clientDir = new File(root, name)
            clientDir.mkdirs()
            def options = new File(clientDir, 'options.txt')
            if (!options.exists()) {
                options.setText("guiScale:${guiScale}\nonboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\nnarrator:0\nrenderDistance:8\nsimulationDistance:6\n", 'UTF-8')
            }
        }
    }
}

tasks.matching { it.name in ['runPhase6Server', 'runPhase6ClientA', 'runPhase6ClientB', 'runPhase6ClientAdmin'] }
        .configureEach {
            dependsOn tasks.named('preparePhase6Acceptance')
        }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    mavenCentral()
    // Optional Create-style visual tutorial library. Finance remains usable
    // without it; the handbook and advancement route are the fallback.
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Ponder publishes a Mojmap development artifact. It is compile-only:
    // players who want animated scenes install Ponder as a separate client mod.
    compileOnly "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

testing {
    suites {
        test {
            useJUnitJupiter('5.10.2')
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Keep the editable GameTest template in tracked source. Forge's 1.20.1
// GameTest loader falls back to <workingDir>/gameteststructures/*.snbt,
// so prepare a fresh copy instead of relying on an ignored run-directory file.
tasks.configureEach {
    if (name == 'prepareRunGameTestServer') {
        inputs.dir(layout.projectDirectory.dir('src/gametest/resources'))
        doLast {
            copy {
                from layout.projectDirectory.dir('src/gametest/resources')
                into layout.projectDirectory.dir('run/gameteststructures')
            }
        }
    }
}
