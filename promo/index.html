<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Trailer</title>
<style>
  html, body { margin: 0; height: 100%; background: #050708; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #cfd8d6; }
  #stage { width: min(100vw, calc((100vh - 60px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #0d1214; }
  #bar { display: flex; gap: 12px; align-items: center; box-sizing: border-box; padding: 12px 16px;
         width: min(100vw, calc((100vh - 60px) * 16 / 9)); }
  #bar button { background: #1b2629; color: #e9efed; border: 1px solid #2f4044; border-radius: 6px;
                padding: 6px 14px; font-size: 14px; cursor: pointer; min-width: 64px; }
  #scrub { flex: 1; accent-color: #2fc4b2; }
  #time { font-family: Consolas, monospace; font-size: 13px; min-width: 96px; text-align: right; }
  body.capture { display: block; }
  body.capture #bar { display: none; }
  body.capture #stage { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bar">
  <button id="play">暂停</button>
  <input id="scrub" type="range" min="0" max="66" step="0.01" value="0">
  <span id="time">0.0 / 66.0</span>
</div>
<script src="textures.js"></script>
<script>
// Finance 宣传片：所有画面由 render(t) 按时间确定性绘制，导出时逐帧调用。
const W = 1920, H = 1080, DURATION = 66;
const C = {
  bg: '#0d1214', teal: '#2fc4b2', tealD: '#1b6f66', brass: '#e0ac4a', walnut: '#8a5a35',
  red: '#ef4d55', green: '#3fd07a', yellow: '#f2c94c', text: '#eef3f1', dim: '#8b9c99',
  panel: 'rgba(20,30,33,0.92)', line: 'rgba(255,255,255,0.09)'
};
const FONT = '"Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif';
const MONO = 'Consolas, "Cascadia Mono", monospace';

const cv = document.getElementById('stage');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

// ---------- 工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const fadeWin = (t, a, b, f = .4) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hash = n => rng(n * 9973 + 17)();
const fmt = n => Math.round(n).toLocaleString('en-US');

function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.w || 500} ${o.size || 32}px ${o.font || FONT}`;
  ctx.fillStyle = o.color || C.text;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 24; }
  ctx.fillText(s, x, y);
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}
function panel(x, y, w, h, o = {}) {
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, o.r ?? 16);
  ctx.fillStyle = o.fill || C.panel; ctx.fill();
  ctx.strokeStyle = o.stroke || C.line; ctx.lineWidth = o.lw || 2; ctx.stroke();
  ctx.restore();
}
function tex(name, cx, cy, size, o = {}) {
  const im = IMG[name]; if (!im) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 40; }
  ctx.drawImage(im, Math.round(cx - size / 2), Math.round(cy - size / 2), size, size);
  ctx.restore();
}
function pmap(rows, pal, cx, cy, cell) {
  const h = rows.length, w = rows[0].length;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const ch = rows[j][i]; if (ch === '.') continue;
    ctx.fillStyle = pal[ch];
    ctx.fillRect(Math.round(cx - w * cell / 2 + i * cell), Math.round(cy - h * cell / 2 + j * cell), Math.ceil(cell), Math.ceil(cell));
  }
}
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('A', a)); g.addColorStop(1, color.replace('A', 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

// ---------- 像素图标 ----------
const INGOT = ['................', '......aaaaaaaa..', '.....abbbbbbbba.', '....abbbbbbbbac.',
  '...aaaaaaaaaacc.', '...bbbbbbbbbbcd.', '...bbbbbbbbbbd..', '...cccccccccc...'];
const INGOT_P = { a: '#f4f6f6', b: '#d3d8d8', c: '#9aa3a3', d: '#6c7474' };
const WHEAT = ['....y..y....', '...yYyyYy...', '....yYYy....', '...yYyyYy...', '....yYYy....',
  '...yYyyYy...', '.....gg.....', '.....gg.....', '....g.g.....', '.....gg.....', '.....gg.....'];
const WHEAT_P = { y: '#ecc65c', Y: '#b88a2c', g: '#7c9a3a' };
const BREAD = ['...bbbbbb...', '..bBBBBBBb..', '.bBbBBbBBBb.', '.bBBBBBBBBb.', '.dbbbbbbbbd.', '..dddddddd..'];
const BREAD_P = { b: '#c98a45', B: '#e7b066', d: '#8a5626' };
const HEAD = ['hhhhhhhh', 'hhhhhhhh', 'hsssssss', 'swbsswbs', 'ssssssss', 'ssmmmmss', 'ssssssss', 'tttttttt'];
const HEAD_P = { h: '#4a2f1a', s: '#c99a72', w: '#ffffff', b: '#3b5bb5', m: '#8a5a45', t: '#2fa6a0' };
const icon = { ingot: (x, y, s) => pmap(INGOT, INGOT_P, x, y, s), wheat: (x, y, s) => pmap(WHEAT, WHEAT_P, x, y, s),
  bread: (x, y, s) => pmap(BREAD, BREAD_P, x, y, s), head: (x, y, s) => pmap(HEAD, HEAD_P, x, y, s) };

// 5×7 像素字
const GLYPH = {
  F: ['11111', '10000', '10000', '11110', '10000', '10000', '10000'],
  I: ['11111', '00100', '00100', '00100', '00100', '00100', '11111'],
  N: ['10001', '11001', '10101', '10011', '10001', '10001', '10001'],
  A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
  C: ['01111', '10000', '10000', '10000', '10000', '10000', '01111'],
  E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'],
  P: ['11110', '10001', '10001', '11110', '10000', '10000', '10000'],
  O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110']
};
function pixelWord(word, x, y, cell, lt, start, stagger = .07) {
  for (let li = 0; li < word.length; li++) {
    const a = prog(lt, start + li * stagger, start + li * stagger + .45);
    if (a <= 0) continue;
    const dy = (1 - eBack(a)) * -70;
    const g = GLYPH[word[li]];
    const lx = x + li * 6 * cell;
    ctx.save(); ctx.globalAlpha *= clamp(a * 2);
    for (let j = 0; j < 7; j++) for (let i = 0; i < 5; i++) {
      if (g[j][i] !== '1') continue;
      const px = lx + i * cell, py = y + j * cell + dy;
      ctx.fillStyle = '#5a3d15'; ctx.fillRect(px + cell * .22, py + cell * .22, cell, cell);
      ctx.fillStyle = `rgb(${lerp(255, 214, j / 6)},${lerp(212, 146, j / 6)},${lerp(122, 52, j / 6)})`;
      ctx.fillRect(px, py, cell, cell);
      ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(px, py, cell, cell * .2);
    }
    ctx.restore();
  }
}

// ---------- 通用元素 ----------
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  glow(W / 2, H * .42, 1100, 'rgba(47,196,178,A)', .09);
  ctx.fillStyle = 'rgba(140,190,180,0.07)';
  const off = (t * 12) % 60;
  for (let x = -60; x < W + 60; x += 60) for (let y = -60; y < H + 60; y += 60) ctx.fillRect(x + off, y + off * .5, 3, 3);
  for (let i = 0; i < 26; i++) {
    const r = rng(i * 31 + 7);
    const sx = r() * W, sp = 10 + r() * 25, sz = 6 + r() * 18, ph = r() * H * 2, teal = r() < .5, al = .04 + r() * .06;
    const y = (H + 100) - ((t * sp + ph) % (H + 200));
    ctx.fillStyle = teal ? `rgba(47,196,178,${al})` : `rgba(224,172,74,${al})`;
    ctx.fillRect(sx, y, sz, sz);
  }
}
function vignette() {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function sub(zh, en, lt, a, b) {
  const al = fadeWin(lt, a, b, .35); if (al <= 0) return;
  ctx.save(); ctx.globalAlpha *= al;
  const g = ctx.createLinearGradient(0, H - 210, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 210, W, 210);
  const dy = (1 - eOut(prog(lt, a, a + .5))) * 14;
  txt(zh, W / 2, H - 104 + dy, { size: 46, w: 700, align: 'center', ls: 2 });
  txt(en, W / 2, H - 58 + dy, { size: 27, w: 400, align: 'center', color: '#a9bbb8', ls: 1 });
  ctx.restore();
}
function chapter(n, zh, en, lt) {
  const al = eOut(prog(lt, .1, .7)); if (al <= 0) return;
  ctx.save(); ctx.globalAlpha *= al;
  const x = 90 - (1 - al) * 40;
  ctx.fillStyle = C.brass; ctx.fillRect(x, 70, 6, 44);
  txt(n, x + 22, 104, { size: 34, w: 800, color: C.brass, font: MONO });
  const wz = txt(zh, x + 82, 102, { size: 30, w: 700 });
  txt(en, x + 82 + wz + 18, 101, { size: 19, color: C.dim, ls: 4 });
  ctx.restore();
}
function chip(label, x, y, color, o = {}) {
  ctx.save();
  ctx.font = `${o.w || 600} ${o.size || 22}px ${FONT}`;
  const w = ctx.measureText(label).width + 36, h = (o.size || 22) + 22;
  const x0 = o.align === 'center' ? x - w / 2 : x;
  ctx.beginPath(); ctx.roundRect(x0, y - h / 2, w, h, h / 2);
  ctx.fillStyle = o.fill || color.replace('rgb', 'rgba').replace(')', ',0.16)'); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = o.textColor || color; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(label, x0 + 18, y + 1);
  ctx.restore();
  return w;
}
const RGB = { teal: 'rgb(47,196,178)', brass: 'rgb(224,172,74)', red: 'rgb(239,77,85)', green: 'rgb(63,208,122)', yellow: 'rgb(242,201,76)', grey: 'rgb(139,156,153)' };

// ---------- 场景 1：片头 ----------
let PIX = [];
function initPix() {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d'); g.drawImage(IMG.market_terminal, 0, 0);
  const d = g.getImageData(0, 0, 16, 16).data;
  for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) {
    const k = (j * 16 + i) * 4; if (d[k + 3] < 10) continue;
    const r = rng(j * 16 + i + 1);
    PIX.push({ i, j, col: `rgba(${d[k]},${d[k + 1]},${d[k + 2]},${d[k + 3] / 255})`,
      a: r() * Math.PI * 2, dist: 700 + r() * 500, del: r() * .5, rot: (r() - .5) * 6 });
  }
}
function intro(lt) {
  const mv = eInOut(prog(lt, 1.8, 2.6));
  const cell = lerp(22, 15, mv), bx = lerp(W / 2, 420, mv), by = lerp(H / 2 - 40, H / 2 - 70, mv);
  glow(bx, by, 420, 'rgba(47,196,178,A)', .3 * prog(lt, .6, 1.5));
  for (const p of PIX) {
    const k = eOut(prog(lt, .05 + p.del, .95 + p.del));
    const tx = bx + (p.i - 8) * cell, ty = by + (p.j - 8) * cell;
    const x = lerp(bx + Math.cos(p.a) * p.dist, tx, k), y = lerp(by + Math.sin(p.a) * p.dist, ty, k);
    const s = cell * lerp(.4, 1, k);
    ctx.save(); ctx.translate(x + s / 2, y + s / 2); ctx.rotate(p.rot * (1 - k));
    ctx.globalAlpha *= clamp(k * 3); ctx.fillStyle = p.col; ctx.fillRect(-s / 2, -s / 2, s + .6, s + .6);
    ctx.restore();
  }
  // 拼合闪光与冲击环
  const fl = 1 - prog(lt, 1.45, 1.9);
  if (lt > 1.45 && fl > 0) {
    ctx.save(); ctx.globalAlpha *= fl * .55; ctx.fillStyle = '#fff';
    ctx.fillRect(bx - 8 * cell, by - 8 * cell, 16 * cell, 16 * cell); ctx.restore();
    const rr = lerp(180, 620, eOut(prog(lt, 1.45, 2.2)));
    ctx.save(); ctx.globalAlpha *= fl; ctx.strokeStyle = C.teal; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(bx, by, rr, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  pixelWord('FINANCE', 620, by - 98, 26, lt, 2.1);
  const sa = eOut(prog(lt, 2.75, 3.3));
  if (sa > 0) {
    ctx.save(); ctx.globalAlpha *= sa;
    ctx.fillStyle = C.teal; ctx.fillRect(620, by + 112, 1066 * sa, 4);
    txt('MINECRAFT 金融经济模组', 620, by + 168, { size: 34, w: 700, color: C.teal, ls: 6 });
    txt('FORGE 1.20.1', 1686, by + 168, { size: 26, w: 600, color: C.dim, ls: 4, align: 'right', font: MONO });
    ctx.restore();
  }
  sub('让方块世界拥有真正的经济', 'A living economy for your blocky world', lt, 3.4, 6.2);
}

// ---------- 场景 2：核心循环 ----------
const NODES = [
  { zh: '采集', en: 'GATHER', icon: 'ingot', tag: '+64 铁锭 Iron' },
  { zh: '仓储', en: 'STORE', tex: 'warehouse_controller', tag: '入库 Stored ×64' },
  { zh: '交易', en: 'TRADE', tex: 'market_terminal', tag: '成交 Sold $1,280' },
  { zh: '生产', en: 'PRODUCE', tex: 'company_factory_controller', tag: '产出 Output ×192' },
  { zh: '上市', en: 'GO PUBLIC', tex: 'securities_terminal', tag: 'IPO ▲ +38%' }
];
function loop(lt) {
  chapter('01', '核心循环', 'THE CORE LOOP', lt);
  const xs = [360, 660, 960, 1260, 1560], y = 470, T0 = 3.4, SEG = 1.05;
  const arrive = i => i === 0 ? T0 : T0 + (i - 1 + .8) * SEG;
  for (let i = 0; i < 4; i++) {
    const a = eInOut(prog(lt, 1.1 + i * .5, 1.6 + i * .5)); if (a <= 0) continue;
    const x1 = xs[i] + 118, x2 = lerp(x1, xs[i + 1] - 118, a);
    ctx.save(); ctx.strokeStyle = 'rgba(47,196,178,0.6)'; ctx.lineWidth = 4;
    ctx.setLineDash([14, 10]); ctx.lineDashOffset = -lt * 60;
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke(); ctx.restore();
    if (a >= 1) { ctx.fillStyle = C.teal; ctx.beginPath(); ctx.moveTo(x2 + 2, y); ctx.lineTo(x2 - 14, y - 10); ctx.lineTo(x2 - 14, y + 10); ctx.fill(); }
  }
  for (let i = 0; i < 5; i++) {
    const a = prog(lt, .4 + i * .5, 1 + i * .5); if (a <= 0) continue;
    const pulse = Math.max(0, 1 - Math.abs(lt - arrive(i)) / .35);
    const s = eBack(a) * (1 + pulse * .08);
    ctx.save(); ctx.translate(xs[i], y); ctx.scale(s, s);
    if (pulse > 0) { ctx.save(); ctx.globalAlpha *= pulse; glow(0, 0, 200, 'rgba(47,196,178,A)', .5); ctx.restore(); }
    panel(-110, -110, 220, 220, { stroke: lt >= arrive(i) ? 'rgba(47,196,178,0.75)' : C.line, lw: 3 });
    txt(String(i + 1), -92, -80, { size: 20, w: 800, color: C.brass, font: MONO });
    if (NODES[i].icon) icon[NODES[i].icon](0, 0, 9); else tex(NODES[i].tex, 0, 0, 128);
    ctx.restore();
    ctx.save(); ctx.globalAlpha *= clamp(a * 1.5);
    txt(NODES[i].zh, xs[i], y + 168, { size: 40, w: 700, align: 'center' });
    txt(NODES[i].en, xs[i], y + 204, { size: 19, color: C.dim, align: 'center', ls: 4 });
    ctx.restore();
    const ta = eOut(prog(lt, arrive(i), arrive(i) + .5));
    if (ta > 0) {
      ctx.save(); ctx.globalAlpha *= ta;
      chip(NODES[i].tag, xs[i], y - 160 - ta * 14, i === 4 ? RGB.green : RGB.brass, { align: 'center', size: 20 });
      ctx.restore();
    }
  }
  // 沿链路移动的物品
  const seg = (lt - T0) / SEG;
  if (seg >= 0 && lt < 8.8) {
    const i = Math.min(3, Math.floor(seg)), f = seg >= 4 ? 1 : eInOut(clamp((seg - i) * 1.25));
    const x = lerp(xs[i], xs[i + 1], f), hop = Math.sin(f * Math.PI) * 60;
    ctx.save(); ctx.globalAlpha *= 1 - prog(lt, 8.2, 8.8);
    glow(x, y - 150 - hop, 60, 'rgba(224,172,74,A)', .6);
    icon.ingot(x, y - 150 - hop, 4);
    ctx.restore();
  }
  sub('从一块铁锭开始：采集、入库、交易、生产、上市', 'Start with one iron ingot: gather, store, trade, produce, go public', lt, 1.0, 9.2);
}

// ---------- 场景 3：商品市场 ----------
function genCandles(n, seed) {
  const r = rng(seed); let p = 100; const out = [];
  for (let i = 0; i < n; i++) {
    let d = .007;
    if (i >= 52 && i < 56) d = -.14; else if (i >= 56 && i < 62) d = .04; else if (i >= 62) d = .012;
    const o = p, c = o * (1 + d + (r() - .5) * .05);
    out.push({ o, c, h: Math.max(o, c) * (1 + r() * .025), l: Math.min(o, c) * (1 - r() * .025),
      v: .25 + r() * .6 + (Math.abs(d) > .03 ? 1 : 0) });
    p = c;
  }
  return out;
}
const CANDLES = genCandles(70, 42);
const CMAX = Math.max(...CANDLES.map(c => c.h)) * 1.03, CMIN = Math.min(...CANDLES.map(c => c.l)) * .95;
const CRASH = Math.round((1 - CANDLES[55].c / CANDLES[51].c) * 100);
function market(lt) {
  chapter('02', '商品市场', 'COMMODITY MARKET', lt);
  const ap = eOut(prog(lt, .1, .8)), off = (1 - ap) * 50;
  const RATE = 7.5, T = .7, tc = T + 52 / RATE;
  const n = clamp((lt - T) * RATE, 0, CANDLES.length);
  const vis = Math.floor(n), frac = n - vis;
  const shake = lt > tc && lt < tc + .5 ? Math.sin(lt * 90) * 10 * (1 - prog(lt, tc, tc + .5)) : 0;
  ctx.save(); ctx.globalAlpha *= ap; ctx.translate(shake, off);
  const X0 = 100, Y0 = 160, PW = 1180, PH = 720;
  panel(X0, Y0, PW, PH);
  // 表头
  icon.ingot(158, 216, 4);
  txt('铁锭', 205, 228, { size: 34, w: 700 });
  txt('IRON INGOT · 日K', 292, 226, { size: 18, color: C.dim, ls: 3 });
  const last = vis < CANDLES.length ? CANDLES[Math.min(vis, CANDLES.length - 1)] : CANDLES[CANDLES.length - 1];
  const price = vis < CANDLES.length ? lerp(last.o, last.c, frac) : last.c;
  const prev = vis > 0 ? CANDLES[Math.min(vis, CANDLES.length) - 1].o : CANDLES[0].o;
  const chg = (price / prev - 1) * 100, up = chg >= 0;
  txt('$' + price.toFixed(2), 1100, 232, { size: 46, w: 700, align: 'right', font: MONO, color: up ? C.green : C.red });
  txt((up ? '▲ +' : '▼ ') + chg.toFixed(2) + '%', 1250, 228, { size: 24, w: 700, align: 'right', font: MONO, color: up ? C.green : C.red });
  // 网格
  const cx0 = 140, cx1 = 1240, py0 = 290, py1 = 700, vy1 = 850;
  const Y = v => lerp(py1, py0, (v - CMIN) / (CMAX - CMIN));
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) { const yy = lerp(py0, py1, k / 4); ctx.beginPath(); ctx.moveTo(cx0, yy); ctx.lineTo(cx1, yy); ctx.stroke(); }
  const cw = (cx1 - cx0) / CANDLES.length, bw = cw * .62;
  const VMAX = Math.max(...CANDLES.map(c => c.v));
  const count = Math.min(CANDLES.length, vis + 1);
  for (let i = 0; i < count; i++) {
    const c = CANDLES[i], isLast = i === vis;

  if (ha > 0) { txt('一整套金融工具', 900, 528, { size: 26, w: 700, alpha: ha }); txt('THE FULL TOOLKIT', 1100, 527, { size: 15, color: C.dim, ls: 3, alpha: ha }); }
  tools.forEach((tl, i) => {
    const a = eBack(prog(lt, 3.8 + i * .12, 4.3 + i * .12)); if (a <= 0) return;
    const x = 900 + (i % 4) * 232, y = 560 + Math.floor(i / 4) * 120;
    ctx.save(); ctx.translate(x + 105, y + 50); ctx.scale(a, a); ctx.translate(-105, -50);
    panel(0, 0, 210, 100, { stroke: tl[2].replace('rgb', 'rgba').replace(')', ',0.6)'), r: 12 });
    ctx.fillStyle = tl[2]; ctx.fillRect(0, 22, 5, 56);
    txt(tl[0], 26, 48, { size: 26, w: 700 }); txt(tl[1].toUpperCase(), 26, 76, { size: 14, color: C.dim, ls: 3 });
    ctx.restore();
  });
  sub('银行、利率、国债、期货与保险：一整套金融体系', 'Banks, interest rates, bonds, futures and insurance: a full financial system', lt, .9, 8.2);
}

// ---------- 场景 7：宏观实体经济 ----------
const TOWNS = [
  { x: 330, y: 330, tex: 'settlement_trade_station_green', zh: '橡木镇', en: 'Oakvale', bread: 9.4, mood: 1 },
  { x: 820, y: 260, tex: 'settlement_trade_station_yellow', zh: '石桥村', en: 'Stonebridge', bread: 12.8, mood: 0 },
  { x: 560, y: 640, tex: 'settlement_trade_station_green', zh: '麦田镇', en: 'Wheatfield', bread: 7.1, mood: 1 },
  { x: 1080, y: 590, tex: 'settlement_trade_station_red', zh: '黑石矿镇', en: 'Blackrock', bread: 17.5, mood: -1 }
];
const ROUTES = [[0, 1], [0, 2], [1, 3], [2, 3], [1, 2]];
function macro(lt) {
  chapter('06', '宏观实体经济', 'A LIVING WORLD', lt);
  const ma = eOut(prog(lt, .1, .8));
  ctx.save(); ctx.globalAlpha *= ma; ctx.translate(0, (1 - ma) * 40);
  // 地图
  const MX = 100, MY = 160, TS = 50, cols = 24, rows = 14;
  ctx.save(); ctx.beginPath(); ctx.roundRect(MX, MY, cols * TS, rows * TS, 16); ctx.clip();
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const n = hash(i * 57 + j * 131), river = Math.abs(j - (7 + Math.sin(i * .45) * 2.2)) < .7;
    ctx.fillStyle = river ? (n < .5 ? '#2b6a8f' : '#2f7399') : n < .15 ? '#3c6b2e' : n < .6 ? '#4d7f37' : n < .9 ? '#55893c' : '#6b6b5a';
    ctx.fillRect(MX + i * TS, MY + j * TS, TS, TS);
  }
  ctx.fillStyle = 'rgba(10,16,18,0.35)'; ctx.fillRect(MX, MY, cols * TS, rows * TS);
  ctx.restore();
  // 商路与商队
  ROUTES.forEach(([a, b], ri) => {
    const A = TOWNS[a], B = TOWNS[b], ra = prog(lt, .9 + ri * .15, 1.5 + ri * .15); if (ra <= 0) return;
    ctx.save(); ctx.strokeStyle = 'rgba(240,220,170,0.55)'; ctx.lineWidth = 4; ctx.setLineDash([10, 10]); ctx.lineDashOffset = -lt * 30;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(lerp(A.x, B.x, ra), lerp(A.y, B.y, ra)); ctx.stroke(); ctx.restore();
    if (ra >= 1) for (let c = 0; c < 2; c++) {
      const f = ((lt - 1.5) * .22 + c * .5 + ri * .17) % 1, back = ri % 2 === 1;
      const x = lerp(A.x, B.x, back ? 1 - f : f), y = lerp(A.y, B.y, back ? 1 - f : f);
      ctx.fillStyle = '#6b4424'; ctx.fillRect(x - 11, y - 9, 22, 16); ctx.fillStyle = '#c99a5a'; ctx.fillRect(x - 11, y - 9, 22, 5);
    }
  });
  // 聚落
  TOWNS.forEach((tw, i) => {
    const a = eBack(prog(lt, .4 + i * .15, .9 + i * .15)); if (a <= 0) return;
    ctx.save(); ctx.translate(tw.x, tw.y); ctx.scale(a, a);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, 40, 46, 12, 0, 0, Math.PI * 2); ctx.fill();
    tex(tw.tex, 0, 0, 80);
    ctx.restore();
    // 情绪粒子
    for (let k = 0; k < 5; k++) {
      if (tw.mood === 0) break;
      const f = ((lt + k * .37 + i) * .6) % 1, px = tw.x - 30 + hash(k + i * 9) * 60;
      ctx.save(); ctx.globalAlpha *= (1 - f) * a;
      ctx.fillStyle = tw.mood > 0 ? C.green : C.red;
      if (tw.mood > 0) { ctx.fillRect(px - 4, tw.y - 50 - f * 70, 8, 8); }
      else { ctx.font = `800 26px ${FONT}`; ctx.fillText('!', px, tw.y - 50 - f * 70); }
      ctx.restore();
    }
    const la = prog(lt, 1 + i * .15, 1.4 + i * .15);
    ctx.save(); ctx.globalAlpha *= la;
    txt(tw.zh, tw.x, tw.y + 78, { size: 22, w: 700, align: 'center' });
    txt(tw.en.toUpperCase(), tw.x, tw.y + 98, { size: 12, color: '#c5d2cf', align: 'center', ls: 2 });
    const pr = tw.bread * (1 + Math.sin(lt * 1.3 + i) * .03), hi = tw.bread > 11;
    ctx.translate(tw.x + 52, tw.y - 34);
    panel(0, -20, 128, 40, { r: 20, fill: 'rgba(12,18,20,0.92)', stroke: hi ? C.red : C.green });
    icon.bread(22, 0, 2.2);
    txt('$' + pr.toFixed(1), 42, 8, { size: 19, w: 700, font: MONO, color: hi ? C.red : C.green });
    ctx.restore();
  });
  ctx.restore();
  // 金融周报
  const na = eOut(prog(lt, 1.6, 2.4));
  if (na > 0) {
    ctx.save(); ctx.translate(1580 + (1 - na) * 500, 500); ctx.rotate(.035 * na);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 40;
    ctx.fillStyle = '#efe6d2'; ctx.fillRect(-250, -330, 500, 640); ctx.shadowBlur = 0;
    const ink = '#2a2420';
    txt('金融周报', 0, -262, { size: 52, w: 900, align: 'center', color: ink, font: '"SimSun","Songti SC",serif' });
    txt('THE FINANCE WEEKLY · 第 37 期', 0, -228, { size: 15, align: 'center', color: '#6a5d50', ls: 3 });
    ctx.fillStyle = ink; ctx.fillRect(-220, -212, 440, 4); ctx.fillRect(-220, -204, 440, 1);
    txt('号外！黑石矿工罢工', 0, -150, { size: 40, w: 900, align: 'center', color: '#9a1d22' });
    txt('EXTRA! Blackrock miners strike', 0, -112, { size: 20, w: 600, align: 'center', color: ink });
    for (let k = 0; k < 7; k++) {
      const w1 = 120 + hash(k * 3) * 80, w2 = 120 + hash(k * 3 + 1) * 80;
      ctx.fillStyle = 'rgba(42,36,32,0.35)'; ctx.fillRect(-220, -78 + k * 20, w1, 8); ctx.fillRect(10, -78 + k * 20, w2, 8);
    }
    // CPI 迷你图
    txt('CPI', -220, 108, { size: 18, w: 800, color: ink, font: MONO });
    txt('+2.8%', 220, 108, { size: 18, w: 800, color: '#9a1d22', font: MONO, align: 'right' });
    ctx.strokeStyle = '#9a1d22'; ctx.lineWidth = 3; ctx.beginPath();
    const cp = prog(lt, 2.4, 5);
    for (let k = 0; k <= 30 * cp; k++) { const x = -220 + k * 440 / 30, y = 230 - k * 2.2 - Math.sin(k * .7) * 10 - hash(k + 40) * 14; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    txt('— 每周一期，到聚落贸易站领取', 0, 288, { size: 16, align: 'center', color: '#6a5d50' });
    ctx.restore();
  }
  sub('聚落、人口、物价、商路与罢工：一个会自己运转的世界', 'Settlements, people, local prices, trade routes and strikes: a world that runs itself', lt, .9, 7.2);
}

// ---------- 场景 8：片尾 ----------
const OUTRO_TEX = ['portable_ledger', 'market_terminal', 'warehouse_controller', 'bank_counter', 'company_desk',
  'company_factory_controller', 'securities_terminal', 'boardroom_table', 'central_bank_console',
  'settlement_trade_station_green', 'survey_board', 'sealed_cargo_crate', 'finance_guide'];
function outro(lt) {
  const n = OUTRO_TEX.length, gap = 128, x0 = W / 2 - (n - 1) * gap / 2;
  OUTRO_TEX.forEach((k, i) => {
    const a = eBack(prog(lt, .1 + i * .06, .55 + i * .06)); if (a <= 0) return;
    const bob = Math.sin(lt * 2 + i * .6) * 6;
    ctx.save(); ctx.translate(x0 + i * gap, 270 + bob); ctx.scale(a, a); tex(k, 0, 0, 96); ctx.restore();
  });
  glow(W / 2, 520, 600, 'rgba(224,172,74,A)', .12 * prog(lt, .8, 1.6));
  pixelWord('FINANCE', W / 2 - 41 * 24 / 2, 440, 24, lt, .9);
  const a = eOut(prog(lt, 1.8, 2.4));
  if (a > 0) {
    ctx.save(); ctx.globalAlpha *= a;
    txt('从一块铁锭，到一个经济体', W / 2, 720, { size: 50, w: 800, align: 'center', ls: 4 });
    txt('From one iron ingot to a whole economy', W / 2, 772, { size: 28, color: '#a9bbb8', align: 'center', ls: 1 });
    ctx.restore();
  }
  const b = eOut(prog(lt, 2.6, 3.2));
  if (b > 0) {
    ctx.save(); ctx.globalAlpha *= b;
    const tags = ['Minecraft 1.20.1', 'Forge 47', 'by H-Jeong'];
    let ws = tags.map(s => { ctx.font = `600 22px ${FONT}`; return ctx.measureText(s).width + 36; });
    let x = W / 2 - (ws.reduce((s, w) => s + w, 0) + 16 * (tags.length - 1)) / 2;
    tags.forEach((s, i) => { chip(s, x, 868, i === 2 ? RGB.brass : RGB.teal, { size: 22 }); x += ws[i] + 16; });
    ctx.restore();
  }
}

// ---------- 时间线 ----------
const SCENES = [[0, 6.2, intro], [6, 15.2, loop], [15, 26.2, market], [26, 36.2, company],
  [36, 45.2, stocks], [45, 53.2, bank], [53, 60.2, macro], [60, 66, outro]];
function render(t) {
  ctx.save();
  ctx.globalAlpha = 1;
  background(t);
  for (const [s, e, fn] of SCENES) {
    if (t < s || t >= e) continue;
    ctx.save();
    ctx.globalAlpha = fadeWin(t, s, e, s === 0 ? .6 : .45);
    if (ctx.globalAlpha > 0) fn(t - s);
    ctx.restore();
  }
  vignette();
  // 进度条
  ctx.fillStyle = 'rgba(47,196,178,0.7)'; ctx.fillRect(0, H - 4, W * t / DURATION, 4);
  // 片尾淡出与片头淡入
  const black = Math.max(1 - prog(t, 0, .5), prog(t, DURATION - .8, DURATION));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

// ---------- 启动 ----------
const IMG = {};
const ready = Promise.all(Object.entries(TEX).map(([k, src]) => new Promise(res => {
  const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = res; im.src = src;
}))).then(() => document.fonts.ready).then(initPix);

window.DURATION = DURATION;
window.renderFrame = t => render(t);
window.trailerReady = ready;

if (new URLSearchParams(location.search).has('capture')) {
  document.body.classList.add('capture');
} else {
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  let playing = true, t = 0, last = null;
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '暂停' : '播放'; if (playing && t >= DURATION) t = 0; };
  scrub.oninput = () => { t = +scrub.value; };
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playBtn.click(); } });
  ready.then(() => {
    const step = now => {
      if (last != null && playing) t += (now - last) / 1000;
      last = now;
      if (t >= DURATION) { t = DURATION; playing = false; playBtn.textContent = '播放'; }
      render(Math.min(t, DURATION - 1e-3));
      scrub.value = t; time.textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)}`;
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
