modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="finance"
version="${mod_version}"
displayName="Finance"
authors="H-Jeong"
description='''Minecraft 服务器金融系统模组：账户与转账、商品交易与仓储物流、公司经营与上市、股票/债券/基金/期货/保险、商业银行与中央银行调控，以及聚落与区域经济玩法。'''

[[dependencies.finance]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.finance]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 可选的客户端动画教学；未安装 Ponder 时，手册与进度路线仍完整可用。
[[dependencies.finance]]
    modId="ponder"
    mandatory=false
    versionRange="[1.0.92,1.1)"
    ordering="AFTER"
    side="CLIENT"
